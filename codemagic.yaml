workflows:
  android-release:
    name: Recber Android Build
    max_build_duration: 60

    environment:
      groups:
        - recber
      node: 18.18.0

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Expo prebuild
        script: |
          npx expo prebuild --clean --platform android

          # Google Play target SDK şartı için Android 15 / API 35
          sed -i '' 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 35/g' android/build.gradle || true
          sed -i '' 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 35/g' android/build.gradle || true
          sed -i '' 's/minSdkVersion = [0-9][0-9]*/minSdkVersion = 24/g' android/build.gradle || true

          sed -i '' 's/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i '' 's/targetSdkVersion [0-9][0-9]*/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i '' 's/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i '' 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 35/g' android/app/build.gradle || true

          sed -i '' '/enableBundleCompression/d' android/app/build.gradle || true

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks

          cd android/app/build/outputs/apk/release

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/keystore.jks \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" \
            app-release-unsigned.apk \
            "$CM_KEY_ALIAS"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
