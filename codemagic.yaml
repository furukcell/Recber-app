workflows:
  android-release:
    name: Recber Android Build
    max_build_duration: 60
    environment:
      groups:
        - gayit
      node: 18.18.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild
        script: npx expo prebuild --clean --platform android
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
      - name: Sign AAB
        script: |
          cd android/app/build/outputs/bundle/release
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $CM_KEYSTORE -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD app-release.aab $CM_KEY_ALIAS
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - kurtulusfaruk94@gmail.com
